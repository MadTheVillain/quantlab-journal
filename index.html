<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantlab.AI — Trade Performance</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-main">
        <h1 class="app-title">Quantlab.AI
          <span class="title-separator">
            &mdash;
          </span>
          <span class="title-sub">Trade Performance</span>
        </h1>
        <div class="header-meta">
          <div class="meta-item"><span class="meta-label">SYMBOL</span><span id="meta-symbol" class="meta-value">&mdash;</span></div>
          <div class="meta-item"><span class="meta-label">ACCOUNT</span><span id="meta-account" class="meta-value">&mdash;</span></div>
          <div class="meta-item"><span class="meta-label">GENERATED</span><span id="meta-generated" class="meta-value">&mdash;</span></div>
        </div>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
    </header>

    <main class="dashboard">
      <section class="kpi-row">
        <article class="card kpi-card" id="card-netpnl">
          <div class="card-label">NET PNL</div>
          <div class="kpi-main">
            <span id="kpi-netpnl" class="kpi-value">&mdash;</span>
          </div>
          <div class="card-sub" id="kpi-trades">0 trades</div>
        </article>

        <article class="card kpi-card">
          <div class="card-label">PROFIT FACTOR</div>
          <div class="kpi-with-chart">
            <div class="kpi-main">
              <span id="kpi-pf" class="kpi-value">&mdash;</span>
            </div>
            <div class="mini-chart-wrapper">
              <canvas id="chart-profit-factor"></canvas>
            </div>
          </div>
        </article>

        <article class="card kpi-card">
          <div class="card-label">WIN RATE</div>
          <div class="kpi-with-chart">
            <div class="kpi-main">
              <span id="kpi-winrate" class="kpi-value">&mdash;</span>
            </div>
            <div class="gauge-wrapper">
              <svg id="gauge-winrate" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
                <path class="gauge-track" d="M10 50 A40 40 0 0 1 90 50" />
                <path class="gauge-fill" d="M10 50 A40 40 0 0 1 90 50" />
                <line class="gauge-needle" x1="50" y1="50" x2="50" y2="18" />
                <circle class="gauge-center" cx="50" cy="50" r="3" />
              </svg>
            </div>
          </div>
          <div class="card-sub" id="kpi-winrate-detail">0w / 0l</div>
        </article>

        <article class="card kpi-card">
          <div class="card-label">AVG WIN / LOSS</div>
          <div class="diverging-bar-wrapper">
            <div class="diverging-bar">
              <div class="diverging-segment loss" id="bar-avg-loss"></div>
              <div class="diverging-segment win" id="bar-avg-win"></div>
              <div class="diverging-center-line"></div>
            </div>
          </div>
          <div class="card-sub" id="kpi-avgwl-text">Win &mdash; / Loss &mdash;</div>
        </article>
      </section>

      <section class="second-row">
        <div class="calendar-column">
          <article class="card calendar-card">
            <header class="card-header">
              <div>
                <div class="card-label">PNL CALENDAR</div>
                <div id="calendar-month-label" class="card-sub">&mdash;</div>
              </div>
              <div class="calendar-nav">
                <button class="nav-btn" id="month-prev" aria-label="Previous month">&#10094;</button>
                <button class="nav-btn" id="month-next" aria-label="Next month">&#10095;</button>
              </div>
            </header>
            <div class="calendar-grid">
              <div class="calendar-weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div class="wk-head">&nbsp;</div>
              </div>
              <div id="calendar-days" class="calendar-days"></div>
            </div>
          </article>
        </div>

        <div class="performance-column">
          <article class="card performance-card">
            <header class="card-header">
              <div>
                <div class="card-label">PERFORMANCE SCORE</div>
                <div class="card-sub">Composite of six risk metrics</div>
              </div>
              <div class="perf-score-wrapper">
                <div class="perf-score-label">Score</div>
                <div id="perf-score-value" class="perf-score-value">&mdash;</div>
              </div>
            </header>
            <div class="performance-chart-wrapper">
              <canvas id="chart-performance"></canvas>
            </div>
            <ul class="perf-metrics-list" id="perf-metrics-list"></ul>
          </article>
        </div>
      </section>
    </main>
  </div>

  <!-- Trade recap modal -->
  <div id="recap-modal" class="recap-modal" aria-hidden="true">
    <div class="recap-scrim"></div>
    <div class="recap-dialog" role="dialog" aria-modal="true">
      <button id="recap-close" class="recap-close" aria-label="Close">&times;</button>
      <div class="recap-head">
        <div id="recap-daytotal" class="recap-daytotal">&mdash;</div>
        <div id="recap-tabs" class="recap-tabs"></div>
      </div>
      <div class="recap-body">
        <aside id="recap-stats" class="recap-stats"></aside>
        <section class="recap-right">
          <div id="recap-chart" class="recap-chart"></div>
          <div class="recap-notes">
            <div class="recap-notes-title">Notes</div>
            <div id="recap-notes-body" class="recap-notes-body">&mdash;</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
